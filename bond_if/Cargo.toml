[package]
name = "bond_if"
version = "0.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
bond_lib = { path = "../bond_lib" }
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51.1", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
